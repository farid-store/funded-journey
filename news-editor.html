:root{--ch:#171717;--iv:#E9E1D2;--gold:#C9A66B;--gr:#77736D;--grn:#526B59;--red:#963F3B;--gp:#242424}

/* ============ APP UI ============ */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#121212;color:var(--iv);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.app{position:fixed;inset:0;background:#121212;display:grid;grid-template-rows:56px 1fr}
header.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #2a2a2a;background:var(--ch)}
.logo{font:700 17px 'Playfair Display',serif;letter-spacing:.16em}
.logo-sub{color:var(--gr);font-size:13px}
.sp{flex:1}
.btn{border:1px solid #3a3a3a;background:#1f1f1f;color:var(--iv);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--ch);border-color:var(--gold);font-weight:700}
.btn.gold:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.danger:hover{border-color:#963F3B;color:#e0a3a0}
.main{display:grid;grid-template-columns:450px 1fr;min-height:0}
aside{border-right:1px solid #2a2a2a;display:flex;flex-direction:column;min-height:0;background:var(--ch)}
.tabs{display:flex;border-bottom:1px solid #2a2a2a}
.tab{flex:1;padding:13px 6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--gr);font-weight:500;cursor:pointer}
.tab.on{color:var(--iv);border-color:var(--gold)}
.pane{display:none;overflow:auto;padding:16px 18px 60px;flex:1}
.pane.on{display:block}
.fld{margin-bottom:12px}
.fld label,.lbl{display:block;font-size:12.5px;color:#a8a39a;margin-bottom:5px;font-weight:500}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;background:#202020;border:1px solid #333;border-radius:8px;padding:9px 11px;outline:none}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.seg button{padding:9px 4px;border:1px solid #333;background:#202020;border-radius:8px;cursor:pointer;font-weight:500;color:#a8a39a}
.seg button.on{border-color:var(--gold);color:var(--iv);background:#2a251c}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{border:1px solid #333;background:#1d1d1d;border-radius:999px;padding:5px 11px;cursor:pointer;color:#c8c2b6;font-size:12.5px}
.chips button:hover{border-color:var(--gold)}
.box{border:1px solid #2f2f2f;border-radius:10px;padding:12px;margin-bottom:12px;background:#1b1b1b}
.box h4{margin:0 0 8px;font-size:13px;font-weight:700}
.hint{color:#8a857c;font-size:12.5px;line-height:1.5}
.log{font:500 12.5px 'JetBrains Mono',monospace;color:#a8a39a;white-space:pre-wrap;line-height:1.55}
.warn{border-left:3px solid #963F3B;padding:8px 10px;background:#241a19;border-radius:0 8px 8px 0;margin:6px 0;font-size:12.5px;line-height:1.5}
.okc{border-left:3px solid #526B59;padding:8px 10px;background:#1a211c;border-radius:0 8px 8px 0;margin:6px 0;font-size:12.5px;line-height:1.5}
.src{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #2a2a2a}
.src:first-child{border-top:0}
.src div{flex:1;min-width:0}
.src b{display:block;font-size:13px;line-height:1.35}
.src small{color:#8a857c;font-size:12px;word-break:break-all}
.pill-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pcard{border:1px solid #333;border-radius:10px;padding:10px;cursor:pointer;background:#1d1d1d}
.pcard.on{border-color:var(--gold)}
.pcard b{display:block;font-size:13px;margin-bottom:6px}
.sw{display:flex;gap:4px}
.sw i{display:block;width:18px;height:18px;border-radius:4px;border:1px solid #444}
.slist .si{display:flex;align-items:center;gap:8px;border:1px solid #2f2f2f;background:#1b1b1b;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.slist .si.on{border-color:var(--gold)}
.slist .si .n{font:500 12px 'JetBrains Mono',monospace;color:var(--gr);width:22px}
.slist .si .t{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .si .t small{color:var(--gr);display:block;font-size:11.5px}
.slist .si button{border:1px solid #333;background:#232323;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:12px}
.slist .si button:hover{border-color:var(--gold)}
.grp{border:1px solid #2f2f2f;border-radius:10px;padding:10px;margin-bottom:10px;background:#1b1b1b}
.grp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:12.5px;color:#c8c2b6}
.grp-h span button{margin-left:4px}
.stage{display:grid;grid-template-rows:1fr auto;min-height:0;padding:14px 18px;gap:10px;min-width:0}
.pvbox{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.pvwrap{position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.pvwrap .in{transform-origin:top left;position:absolute;left:0;top:0}
.nav{display:flex;align-items:center;justify-content:center;gap:12px}
.nav .cnt{font:500 13px 'JetBrains Mono',monospace;color:#a8a39a;min-width:80px;text-align:center}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;justify-content:flex-start}
.th{flex:none;width:90px;height:120px;position:relative;border:2px solid transparent;cursor:pointer;overflow:hidden;border-radius:3px}
.th.on{border-color:var(--gold)}
.th .in{position:absolute;left:0;top:0;transform:scale(.08333);transform-origin:top left;width:1080px;height:1440px}
#exp{position:fixed;left:0;top:0;width:1080px;height:1440px;z-index:-1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a251c;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;z-index:99;max-width:80vw}
dialog{background:#1b1b1b;color:var(--iv);border:1px solid #3a3a3a;border-radius:12px;padding:18px;width:min(560px,92vw);max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
@media(max-width:980px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:56vh;border-right:0;border-bottom:1px solid #2a2a2a}}

/* ============ SLIDE (1080 x 1440) ============ */
.sl{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif}
.sl *{box-sizing:border-box;margin:0;padding:0}
.th-journey{--bg:#171717;--fg:#E9E1D2;--mut:rgba(233,225,210,.68);--line:#C9A66B;--acc:#C9A66B;--panel:#1F1F1F;--pline:rgba(233,225,210,.16);--closing:#C9A66B}
.th-portfolio{--bg:#242424;--fg:#E9E1D2;--mut:rgba(233,225,210,.66);--line:#C9A66B;--acc:#C9A66B;--panel:#171717;--pline:rgba(233,225,210,.14);--closing:#C9A66B}
.th-news,.th-motivation{--bg:#E9E1D2;--fg:#171717;--mut:rgba(23,23,23,.68);--line:#C9A66B;--acc:#C9A66B;--panel:rgba(23,23,23,.055);--pline:rgba(23,23,23,.17);--closing:rgba(23,23,23,.78)}
.sl .grain{position:absolute;inset:0}
.sl .mast{position:absolute;left:86px;right:86px;top:112px;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:18px;border-bottom:1px solid var(--line)}
.sl .mast b{font:700 22px 'Playfair Display',serif;letter-spacing:.16em}
.sl .mast span{font:500 18px 'JetBrains Mono',monospace;color:var(--mut)}
.sl .frule{position:absolute;left:86px;right:86px;top:1290px;height:1px;background:var(--line)}
.sl .wm{position:absolute;left:86px;bottom:100px;font:500 26px 'DM Sans',sans-serif}
.sl .pg{position:absolute;right:86px;bottom:104px;font:500 19px 'JetBrains Mono',monospace;color:var(--mut)}
.sl .closing{position:absolute;right:86px;bottom:104px;font:500 17px 'DM Sans',sans-serif;letter-spacing:.22em;color:var(--closing)}
.sl .bd{position:absolute;left:86px;right:86px;top:205px;height:1040px}
.sl .kick{display:flex;align-items:center;gap:16px;font:500 26px 'DM Sans',sans-serif;color:var(--mut)}
.sl .kick i{display:block;width:40px;height:2px;background:var(--line)}
.sl .hl{font-family:'Playfair Display',serif;font-weight:700;line-height:1.1;letter-spacing:-.01em;margin-top:26px;width:100%}
.sl .sub{font:400 30px/1.45 'DM Sans',sans-serif;margin-top:26px;color:var(--fg);opacity:.86;width:800px}
.sl .rule{width:84px;height:2px;background:var(--line);margin-top:28px}
.sl .hero{position:absolute;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.sl .hero img{width:100%;height:100%;display:block}
.sl .hero .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 18px;background:rgba(23,23,23,.86);color:#E9E1D2;font:500 17px 'JetBrains Mono',monospace}
.sl .ttl{font:700 54px/1.1 'Playfair Display',serif;letter-spacing:-.005em}
.sl .txt{font:400 30px/1.45 'DM Sans',sans-serif;margin-top:20px;width:820px;opacity:.88}
.sl .grid{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.sl .mc{background:var(--panel);border:1px solid var(--pline);border-top:4px solid var(--gr);padding:28px 30px 26px;border-radius:4px}
.sl .mc.up{border-top-color:#526B59}.sl .mc.down{border-top-color:#963F3B}
.sl .mc.span2{grid-column:span 2}
.sl .mc .lb{font:500 24px 'DM Sans',sans-serif;color:var(--mut);margin-bottom:14px}
.sl .mc .vl{display:inline-block;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-weight:500;line-height:1.05;letter-spacing:-.02em}
.sl .mc .un{font:500 19px 'JetBrains Mono',monospace;color:var(--mut);margin-top:8px}
.sl .chg{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font:500 20px 'JetBrains Mono',monospace;color:#E9E1D2;background:#77736D;margin-top:16px}
.sl .chg.up{background:#526B59}.sl .chg.down{background:#963F3B}
.sl .mc .meta{margin-top:16px;font:500 17px/1.5 'JetBrains Mono',monospace;color:var(--mut)}
.sl .lst{margin-top:30px;font-size:30px;line-height:1.4;width:100%}
.sl .it{padding:.7em 0;border-top:1px solid var(--pline)}
.sl .it:first-child{border-top:0;padding-top:0}
.sl .chip{display:inline-block;font:700 .62em 'DM Sans',sans-serif;letter-spacing:.03em;padding:.3em .85em;border-radius:999px;margin-bottom:.55em;line-height:1.2}
.sl .k-fact{border:1.5px solid var(--fg);color:var(--fg)}
.sl .k-analysis{background:var(--acc);color:#171717}
.sl .k-risk{background:#963F3B;color:#E9E1D2}
.sl .k-info{border:1.5px solid var(--mut);color:var(--mut)}
.sl .k-step{background:var(--fg);color:var(--bg)}
.sl .k-takeaway{border:1.5px solid var(--line);color:var(--fg)}
.sl .it .t{font-size:1em;line-height:1.42}
.sl .it .s{font:500 .58em/1.4 'JetBrains Mono',monospace;color:var(--mut);margin-top:.55em}
.sl .it .u{font:500 .54em/1.4 'JetBrains Mono',monospace;color:var(--mut);margin-top:.2em;word-break:break-all}
.sl .foot{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--pline);padding-top:18px;font:400 23px/1.45 'DM Sans',sans-serif;color:var(--mut)}
.sl .qm{font:700 220px/.7 'Playfair Display',serif;color:var(--line);height:110px}
.sl .qt{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;line-height:1.22;margin-top:30px;width:100%}
.sl .qa{font:500 28px 'DM Sans',sans-serif;margin-top:6px}
.sl .qs{font:400 22px/1.4 'DM Sans',sans-serif;color:var(--mut);margin-top:6px}
.sl .cta-card{margin-top:60px;width:780px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px}
.sl .cta-id{display:flex;align-items:center;gap:30px}
.sl .cta-id svg{width:104px;height:104px;flex:none}
.sl .handle{font:500 34px/1.1 'JetBrains Mono',monospace;letter-spacing:-.01em}
.sl .ppill{margin-top:16px;display:inline-flex;align-items:center;white-space:nowrap;padding:9px 22px;border:1px solid var(--line);border-radius:999px;background:rgba(201,166,107,.14);font:500 21px/1.2 'DM Sans',sans-serif}
.sl .ppill b{font-weight:700;margin-left:.36em}
.sl .fbtn{position:relative;margin-top:34px;height:80px;border-radius:14px;background:#C9A66B;color:#171717;display:flex;align-items:center;justify-content:center;font:700 30px 'DM Sans',sans-serif}
.sl .fbtn svg{position:absolute;left:62%;top:44px;width:42px;height:67px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo">NOT.FARIDD</span><span class="logo-sub">Editorial Generator</span>
    <span class="sp"></span>
    <button class="btn" id="bHist">Riwayat</button>
    <button class="btn" id="bPng">Unduh PNG slide ini</button>
    <button class="btn gold" id="bZip">Unduh semua (ZIP)</button>
  </header>
  <div class="main">
    <aside>
      <div class="tabs">
        <button class="tab on" data-t="ai">Cari dengan AI</button>
        <button class="tab" data-t="slides">Slide</button>
        <button class="tab" data-t="style">Gaya</button>
        <button class="tab" data-t="cfg">Setelan</button>
      </div>
      <div class="pane on" id="p-ai"></div>
      <div class="pane" id="p-slides"></div>
      <div class="pane" id="p-style"></div>
      <div class="pane" id="p-cfg"></div>
    </aside>
    <section class="stage">
      <div class="pvbox" id="pvbox"><div class="pvwrap" id="pvwrap"><div class="in" id="pvin"></div></div></div>
      <div>
        <div class="nav"><button class="btn sm" id="bPrev">Sebelumnya</button><span class="cnt" id="cnt"></span><button class="btn sm" id="bNext">Berikutnya</button></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </section>
  </div>
</div>
<div id="exp"></div>
<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:12px"><button class="btn" id="dlgClose">Tutup</button></div></dialog>

  const ped=Math.round(hh*.2),ent=Math.round(hh*.09),step=Math.round(hh*.075),n=Math.max(4,Math.round(w/135)),top=ped+ent,sh=hh-top-step*2;

  for(let i=0;i<n;i++){const x=padX+i*gap;

async function groq(){
  const url=CFG.endpoint||'https://api.groq.com/openai/v1/chat/completions';
  if(!CFG.endpoint&&!CFG.key)throw new Error('API key Groq belum diisi. Buka tab Setelan.');
  const body={model:CFG.model,temperature:.4,max_completion_tokens:8000,stream:false,reasoning_effort:'low',messages:[{role:'system',content:sysPrompt()},{role:'user',content:userPrompt()}]};
  if(/gpt-oss/.test(CFG.model)){body.tools=[{type:'browser_search'}];body.tool_choice=AI.mode==='motivation'?'auto':'required'}
  const headers={'Content-Type':'application/json'};if(CFG.key)headers.Authorization='Bearer '+CFG.key;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),150000);
  let r;try{r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ac.signal})}catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'Waktu habis (150 detik). Coba model gpt-oss-20b atau topik yang lebih sempit.':'Tidak bisa terhubung ke Groq ('+e.message+'). Kalau browser memblokir (CORS), pakai endpoint proxy di tab Setelan.')}
  clearTimeout(to);const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Respons bukan JSON: '+txt.slice(0,200))}
  if(!r.ok){const m=(j.error&&j.error.message)||txt.slice(0,200);throw new Error(r.status===401?'API key ditolak (401). Cek key di tab Setelan.':r.status===429?'Terkena rate limit Groq (429). Tunggu sebentar lalu coba lagi. '+m:r.status===404?'Model "'+CFG.model+'" tidak tersedia di akun ini. Buka tab Setelan, klik "Cek model akun", lalu pilih model gpt-oss. '+m:'Groq error '+r.status+': '+m)}
  return j}

    else if(t==='sources')out.push(mk.sources({title:str(s.title)||'Sumber',asof:str(s.asof),note:str(s.note)||'Bukan saran investasi.',items:(s.items||[]).slice(0,6).map(i=>({title:str(i.title),publisher:str(i.publisher),date:str(i.date),url:str(i.url)}))}));
    else if(t==='quote')out.push(mk.quote({text:str(s.text),author:str(s.author),sub:str(s.sub)}))});
  if(!out.length)throw new Error('AI tidak mengembalikan slide yang bisa dipakai.');
  return out}

function walk(o,out,d=0){if(!o||d>7)return;if(Array.isArray(o)){o.forEach(x=>walk(x,out,d+1));return}if(typeof o==='object'){if(typeof o.url==='string'&&/^https?:/.test(o.url))out.push({title:str(o.title),url:o.url,content:str(o.content||o.snippet||o.text)});Object.values(o).forEach(v=>walk(v,out,d+1))}}
function collectSearch(msg,pre){
  const out=[];walk(msg.executed_tools,out);let blob=msg.executed_tools?JSON.stringify(msg.executed_tools):'';
  (String(pre).match(/https?:\/\/[^\s)\]>"'<]+/g)||[]).forEach(u=>out.push({title:'',url:u.replace(/[.,;]+$/,''),content:''}));
  blob+=' '+pre;const seen=new Set();
  return{results:out.filter(r=>r.url&&!seen.has(r.url)&&seen.add(r.url)),blob}}

async function generate(){
  const b=$('#bGen');b.disabled=true;LAST={results:[],blob:'',fromAI:false,mode:AI.mode};
  try{
    log('Menghubungi Groq ('+CFG.model+')...\nAI menelusuri web, ini bisa 15 sampai 90 detik.');
    const j=await groq();const ch=(j.choices&&j.choices[0])||{};const msg=ch.message||{};
    log('Menyusun slide dari hasil pencarian...');
    const sp=splitAnswer(msg.content);let o;try{o=extractJSON(sp.json)}catch(e){throw new Error(e.message+(ch.finish_reason==='length'?' Jawaban terpotong karena kepanjangan. Coba 4 slide.':''))}
    const slides=normalize(o);const sr=collectSearch(msg,sp.pre);
    LAST={results:sr.results,blob:sr.blob,fromAI:true,mode:AI.mode};
    S.slides=slides;S.caption=str(o.caption);S.hashtags=(o.hashtags||[]).map(str).filter(Boolean).join(' ');
    S.pillar={news:'news',analysis:'portfolio',education:'journey',motivation:'motivation'}[AI.mode];S.date=todayStr();SEL=0;
    hist(AI.topic,AI.mode);buildForm();buildStyle();refresh(true);
    log('Selesai: '+slides.length+' slide, '+sr.results.length+' sumber dari hasil pencarian.\nCek bagian verifikasi di bawah sebelum mengunggah.');
    $('#aiLog').scrollIntoView({block:'nearest'});renderVerify();renderSearchSrc();
    const cap=$('#p-ai textarea[rows="6"]');if(cap)cap.value=S.caption;const hi=[...document.querySelectorAll('#p-ai .box input')].pop();if(hi)hi.value=S.hashtags;
  }catch(e){log('Gagal: '+e.message)}
  b.disabled=false}

/* ---- verifikasi angka ---- */
function normText(t){return String(t).toLowerCase().replace(/(\d)[.,](?=\d)/g,'$1')}
function verify(){
  const issues=[];const blob=normText(LAST.blob);
  const chk=(txt,where)=>{(String(txt).match(/\d[\d.,]*\d|\d/g)||[]).forEach(tok=>{const dg=tok.replace(/[.,]/g,'');if(dg.length>=3&&!blob.includes(dg))issues.push({where,tok})})};
  S.slides.forEach((s,i)=>{const w='Slide '+(i+1);
    if(s.type==='data')(s.metrics||[]).forEach(m=>chk(m.value,w+' ('+(m.label||'angka')+')'));
    if(s.type==='points')(s.items||[]).forEach(it=>{if(it.kind!=='info'&&it.kind!=='step'&&it.kind!=='takeaway')chk(it.text,w+' ('+KINDS[it.kind]+')')});
    if(s.type==='cover')chk(s.headline+' '+s.sub,w+' (cover)');
    if(s.type==='sources')(s.items||[]).forEach(it=>{if(it.url&&!blob.includes(normText(it.url.replace(/^https?:\/\//,'')).slice(0,40)))issues.push({where:w+' (URL sumber)',tok:'tidak ada di hasil pencarian: '+it.url.slice(0,55)})})});
  return issues}
function renderVerify(){
  const e=$('#aiVerify');if(!e)return;e.innerHTML='';if(!LAST.fromAI)return;
  e.append(h('div',{class:'lbl'},'Verifikasi angka'));
  if(!LAST.blob){e.append(h('div',{class:'warn'},'Respons tidak menyertakan hasil pencarian, jadi angka tidak bisa diperiksa otomatis. Cek semua angka ke sumber sebelum memposting.'));return}
  const iss=verify();
  if(!iss.length)e.append(h('div',{class:'okc'},'Semua angka (3 digit ke atas) ditemukan di teks hasil pencarian. Tetap cocokkan sekilas dengan sumbernya.'));
  else{e.append(h('div',{class:'warn'},'Angka berikut tidak ditemukan di hasil pencarian. Mungkin salah tulis, hasil hitungan AI, atau format beda. Cek manual atau hapus:'));
    iss.slice(0,14).forEach(x=>e.append(h('div',{class:'hint',style:'margin:2px 0 2px 10px'},x.where+': '+x.tok)))}
  e.append(h('div',{class:'hint',style:'margin:6px 0 12px'},'Ini pemeriksaan sederhana (pencocokan teks), bukan jaminan kebenaran.'))}
function renderSearchSrc(){
  const e=$('#aiSrc');if(!e)return;e.innerHTML='';if(!LAST.results.length)return;
  const box=h('div',{class:'box'},h('h4',{},'Hasil pencarian ('+LAST.results.length+')'));
  LAST.results.slice(0,12).forEach(r=>box.append(h('div',{class:'src'},h('div',{},h('b',{},r.title||host(r.url)),h('small',{},r.url)),h('button',{class:'btn sm',onclick:()=>addSource(r)},'Pakai sebagai sumber'))));
  e.append(box)}
function addSource(r){
  let s=S.slides.find(x=>x.type==='sources');if(!s){s=mk.sources({items:[]});S.slides.push(s)}
  if(s.items.some(i=>i.url===r.url))return toast('Sumber sudah ada.');
  s.items.push({title:r.title,publisher:host(r.url),date:'',url:r.url});buildForm();refresh(true);toast('Ditambahkan ke slide Sumber. Isi tanggal terbitnya.')}

/* ---- riwayat ---- */
function hist(topic,mode){const a=LS.get('nf_hist',[]);const c=clone(S);c.slides.forEach(s=>{if(s.img)s.img=''});a.unshift({id:uid(),ts:Date.now(),topic:topic||'(tanpa topik)',mode,state:c});LS.set('nf_hist',a.slice(0,20))}
$('#bHist').onclick=()=>{
  const b=$('#dlgBody');b.innerHTML='';b.append(h('h3',{style:'margin:0 0 10px'},'Riwayat konten'));
  const a=LS.get('nf_hist',[]);if(!a.length)b.append(h('div',{class:'hint'},'Belum ada riwayat. Konten yang dibuat dengan AI akan tersimpan di sini (tanpa gambar unggahan).'));
  a.forEach(x=>b.append(h('div',{class:'src'},h('div',{},h('b',{},x.topic),h('small',{},MODES[x.mode]+' | '+new Date(x.ts).toLocaleString('id-ID'))),
    h('button',{class:'btn sm',onclick:()=>{S=Object.assign(S,x.state);SEL=0;LAST={results:[],blob:'',fromAI:false,mode:x.mode};buildForm();buildStyle();buildAI();refresh(true);$('#dlg').close()}},'Buka'),
    h('button',{class:'btn sm danger',onclick:()=>{LS.set('nf_hist',LS.get('nf_hist',[]).filter(y=>y.id!==x.id));$('#bHist').click()}},'Hapus'))));
  $('#dlg').showModal()};
$('#dlgClose').onclick=()=>$('#dlg').close();

/* ================= init ================= */
(async function init(){
  await fontsReady();
  buildAI();buildForm();buildStyle();buildCfg();refresh(true);
  document.fonts.ready.then(()=>refresh(true));
  window.addEventListener('resize',scalePV)
})();
window.__app={get S(){return S},set S(v){S=v},refresh,buildForm,allSlides,renderPNG,AI,CFG,LAST,generate,buildAI};
</script>
